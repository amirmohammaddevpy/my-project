<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Projects{% endblock %}</title>

  <!-- CSS Block -->
  <style>
    :root {
      --bg: #0e0e0e;
      --card-bg: #1a1a1a;
      --text: #f1f1f1;
      --muted: #9a9a9a;
      --accent: #ff6b6b;
      --border: #2a2a2a;
      --shadow: rgba(0,0,0,0.6);
    }

    * { box-sizing: border-box; margin:0; padding:0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14,14,14,0.9);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .nav-container {
      max-width: 1320px;
      margin: auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-logo { color: var(--accent); font-weight: 600; font-size: 1.2rem; text-decoration: none; }
    .nav-links a { color: var(--muted); text-decoration: none; margin-left: 24px; font-weight: 500; transition: color 0.25s ease; }
    .nav-links a:hover { color: var(--accent); }

    main {
      max-width: 1320px;
      margin: 40px auto;
      padding: 0 24px;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 32px 24px;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    /* Buttons */
    .btn {
      padding: 12px 28px;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(135deg, var(--accent), #ff9a9a);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px var(--shadow);
      color: var(--bg);
    }


.footer {
  margin-top: 80px;
  padding: 45px 24px 20px;
  border-top: 1px solid var(--border);
  background: #111;
  text-align: center;
}

.footer-container {
  max-width: 900px;
  margin: auto;
}

.footer h3 {
  color: var(--text);
  font-size: 1.6rem;
  margin-bottom: 10px;
}

.footer-description {
  color: var(--muted);
  margin-bottom: 25px;
}

.social-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 35px;
}

.social-links a {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 22px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--muted);
  text-decoration: none;
  transition: .3s ease;
}

.social-links a:hover {
  color: var(--accent);
  border-color: var(--accent);
  transform: translateY(-4px);
}

.social-links i {
  font-size: 1.2rem;
}

.footer-bottom {
  padding-top: 20px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: .82rem;
}

.footer-bottom p {
  margin: 5px 0;
}

@media (max-width: 480px) {
  .social-links {
    flex-direction: column;
    align-items: center;
  }

  .social-links a {
    width: 180px;
    justify-content: center;
  }
}


    @media (max-width: 768px) {
      .nav-links a { margin-left: 16px; }
      main { padding: 0 16px; }
    }
  </style>

  {% block css %}{% endblock %}
</head>

<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="{% url 'home' %}" class="nav-logo">My Projects</a>
      <nav class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about_me' %}">About Me</a>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
    
<footer class="footer">
  <div class="footer-container">

    <h3>Let's Connect</h3>

    <p class="footer-description">
      Have a project in mind or want to work together?
      Feel free to reach out.
    </p>

    <div class="social-links">

      <a href="https://github.com/amirmohammaddevpy"
         target="_blank"
         rel="noopener noreferrer">
        <i class="fab fa-github"></i>
        GitHub
      </a>

      <a href="https://www.linkedin.com/in/amir-mohammad-barabadi/"
         target="_blank"
         rel="noopener noreferrer">
        <i class="fab fa-linkedin"></i>
        LinkedIn
      </a>

    </div>

    <div class="footer-bottom">
      <p>
        &copy; 2026 Amir Mohammad Barabadi.
        All Rights Reserved.
      </p>
      <p>Built with passion and Python.</p>
    </div>

  </div>
<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  </footer>
</body>
</html>
