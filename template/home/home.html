{% extends 'base.html' %}
{% load static %}

{% block title %}My Projects{% endblock title %}

{% block content %}

<main class="container">

  <!-- Intro Section -->
  <section class="intro" style="margin-bottom:48px;">
    <h1 style="font-size:2.4rem; margin-bottom:8px;">My Projects</h1>
    <p style="color: var(--muted); max-width:460px;">
      A curated collection of web interfaces.<br>
      Built for inspiration and visual analysis.
    </p>
  </section>

  <!-- Projects Grid -->
  <section class="grid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:24px;">

    {% for project in projects %}
    <a href="{% url 'detail' project.name %}" class="card-link" style="text-decoration:none;">
      <article class="card" style="background: var(--card-bg); border-radius:16px; overflow:hidden; border:1px solid var(--border); transition: transform 0.35s ease, box-shadow 0.35s ease;">
        <img src="{{ project.image.url }}" alt="{{ project.name }}" style="width:100%; height:200px; object-fit:cover; display:block; transition: transform 0.35s ease, filter 0.35s ease;">
        <div class="meta" style="padding:16px;">
          <h3 style="font-size:1rem; font-weight:600; margin-bottom:4px; color: var(--text);">{{ project.name }}</h3>
        </div>
      </article>
    </a>
    {% endfor %}

  </section>
</main>

<!-- Optional inline hover effect -->
<style>
  .card-link:hover .card {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }
  .card-link:hover img {
    transform: scale(1.05);
    filter: brightness(1.1);
  }
</style>

{% endblock content %}
